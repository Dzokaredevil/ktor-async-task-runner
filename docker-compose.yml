services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taskrunner
      POSTGRES_USER: taskrunner
      POSTGRES_PASSWORD: taskrunner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/taskrunner
      DB_USER: taskrunner
      DB_PASSWORD: taskrunner
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata: