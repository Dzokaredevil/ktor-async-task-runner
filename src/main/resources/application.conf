ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.example.taskrunner.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/taskrunner"
    url = ${?DB_URL}
    user = "taskrunner"
    user = ${?DB_USER}
    password = "taskrunner"
    password = ${?DB_PASSWORD}
    maxPoolSize = 10
}